<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบหลังบ้าน - เสถียรการแว่น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-emerald-500/20">
        <!-- Brand Header with Flowing Gold Line -->
        <div class="bg-gradient-to-b from-emerald-900 to-emerald-950 p-8 text-center text-white relative">
            <div class="w-24 h-24 mx-auto rounded-full bg-white p-1 shadow-lg ring-4 ring-amber-400/40 mb-3 overflow-hidden flex items-center justify-center">
                <img src="/logo-image" alt="เสถียรการแว่น" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">เสถียรการแว่น</h1>
            <p class="text-xs text-emerald-200 mt-1">ระบบจัดการหลังบ้าน & ออเดอร์ (Staff Portal)</p>
            <div class="h-1 w-24 bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 rounded-full mx-auto mt-4"></div>
        </div>

        <!-- Login Form -->
        <div class="p-8 space-y-6">
            {% if error %}
            <div class="p-3 bg-red-50 border border-red-200 rounded-2xl flex items-center gap-2 text-red-700 text-xs">
                <span class="text-base">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        🔑 รหัสผ่านแอดมิน (PIN / Password)
                    </label>
                    <div class="relative">
                        <input type="password" id="passwordInput" name="password" required autofocus
                               placeholder="กรอกรหัสผ่านเพื่อเข้าใช้งาน" 
                               class="w-full px-4 py-3.5 pr-12 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent text-sm bg-slate-50 transition">
                        <button type="button" onclick="togglePassword()" 
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
                            👁️
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1.5 flex items-center gap-1">
                        <span>🔒</span> สำหรับคุณเสถียร คุณนก และทีมงานประจำร้าน
                    </p>
                </div>

                <button type="submit" 
                        class="w-full bg-gradient-to-r from-emerald-700 via-emerald-800 to-emerald-900 hover:from-emerald-800 hover:to-emerald-950 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-900/30 transition transform active:scale-98 flex items-center justify-center gap-2 text-sm">
                    <span>เข้าสู่ระบบ</span>
                    <span>➔</span>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center space-y-1">
                <p class="text-xs text-slate-500 font-medium">ศูนย์ราชการแจ้งวัฒนะ อาคาร B ชั้น 1</p>
                <p class="text-[11px] text-slate-400">โทร: 085-433-6699 (คุณนก) • 092-393-7770 (คุณเสถียร)</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>
</html>
