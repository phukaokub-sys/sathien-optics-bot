<!DOCTYPE html>
<html lang="th">
<head>
  {% include "_shop_head.html" %}
  <meta name="robots" content="noindex">
  <title>เข้าสู่ระบบหลังร้าน - เสถียรการแว่น</title>
</head>
<body>
<main class="page">
  {% include "_shop_brand.html" %}

  <h2 class="page-title">หลังร้าน</h2>
  <p class="page-lead">ดูนัดหมาย ออเดอร์ และสลิปสายตาของลูกค้า สำหรับคุณเสถียร คุณนก และทีมงาน</p>

  {% if error %}
  <div class="notice notice-err" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label class="label" for="passwordInput">รหัสผ่าน</label>
      <div class="pw-wrap">
        <input class="input" type="password" id="passwordInput" name="password"
               autocomplete="current-password" required autofocus>
        <button type="button" class="link-btn" id="togglePw" aria-controls="passwordInput">แสดง</button>
      </div>
    </div>
    <button class="btn" type="submit">เข้าสู่ระบบ</button>
  </form>
</main>
<script>
  document.getElementById("togglePw").addEventListener("click", function () {
    const input = document.getElementById("passwordInput");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    this.textContent = show ? "ซ่อน" : "แสดง";
  });
</script>
</body>
</html>
